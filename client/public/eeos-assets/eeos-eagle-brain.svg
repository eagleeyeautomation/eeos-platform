  <style>
    .signal { animation: pulse 3.6s ease-in-out infinite; }
    .stream { stroke-dasharray: 10 18; animation: dash 9s linear infinite; }
    .brain { animation: glow 4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: .28; } 50% { opacity: .9; } }
    @keyframes dash { to { stroke-dashoffset: -180; } }
    @keyframes glow { 0%,100% { filter: drop-shadow(0 0 10px rgba(0,178,255,.35)); } 50% { filter: drop-shadow(0 0 24px rgba(201,162,39,.55)); } }
    @media (prefers-reduced-motion: reduce) {
      .signal, .stream, .brain { animation: none; }
    }
  </style>
